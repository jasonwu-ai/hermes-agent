[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-native-delivery-overlay"
version = "0.1.0"
description = "Qualification-only two-gate Hermes delivery overlay"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_verified_delivery*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
